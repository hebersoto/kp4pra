# KP4PRA TNC additions to Xara's own xara@.service (which comes from the
# Xara release and is replaced on every upgrade - keep KP4PRA changes here).
#
# - Xara and Dire Wolf share the radio and sound card: starting one stops the
#   other (kp4pra-xara modem xara|packet).
# - The config is regenerated from KP4PRA's settings right before each start
#   (kp4pra-xara-prep), so the sound card and CM108 hidraw are always current.
# - GPIO push-to-talk (DRA-Pi-Zero) goes through kp4pra-xara-ptt.
# - Xara's state directory (/var/lib/xara) is on /rw (var-lib-xara.mount).
[Unit]
Description=Xara VARA-compatible modem (KP4PRA TNC)
Conflicts=direwolf.service
After=direwolf.service
Requires=kp4pra-xara-prep.service
Wants=kp4pra-xara-ptt.service
After=kp4pra-xara-prep.service kp4pra-xara-ptt.service var-lib-xara.mount
RequiresMountsFor=/var/lib/xara
