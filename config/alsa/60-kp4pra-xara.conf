# KP4PRA TNC - shared playback for Xara on an I2S board (DRA-Pi-Zero).
#
# On the Orange Pi's I2S sound, recording delivers no audio while the
# playback side is open but idle - and Xara keeps playback open and idle
# while it listens ("capture (no audio): timed out"). So Xara plays through
# this device (plug -> dmix -> the card), and kp4pra-xara-keepalive plays
# silence into the same dmix the whole time Xara runs. Silence adds nothing
# to Xara's signal; push-to-talk is separate, so nothing is transmitted.
#
# Use:  kp4pra_out:CARD=<ALSA card id>     e.g. kp4pra_out:CARD=DRAPiZero
pcm.kp4pra_out {
    @args [ CARD ]
    @args.CARD { type string }
    type plug
    slave.pcm {
        type dmix
        ipc_key 4842
        ipc_perm 0666
        slave {
            pcm { type hw card $CARD device 0 }
            rate 48000
            channels 2
            format S16_LE
            period_size 480
            buffer_size 3840
        }
    }
}
