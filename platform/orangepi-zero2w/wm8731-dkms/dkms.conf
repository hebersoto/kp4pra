# KP4PRA TNC - patched WM8731 codec driver for the DRA-Pi-Zero on the
# Orange Pi Zero 2W. Installed by scripts/setup-dra-pi-zero.sh, which fills
# in PACKAGE_VERSION. DKMS rebuilds it automatically for every new kernel.
#
# prepare.sh downloads the WM8731 driver source that matches the kernel being
# built (git.kernel.org stable, GitHub mirror as fallback), keeps a cached copy
# in /var/cache/kp4pra-wm8731, and applies the KP4PRA patches. No kernel source
# is stored in this repository.
PACKAGE_NAME="kp4pra-wm8731"
PACKAGE_VERSION="@VERSION@"
PRE_BUILD="prepare.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="snd-soc-wm8731"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="snd-soc-wm8731-i2c"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
